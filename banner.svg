<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0a1a4a"/>
      <stop offset="1" stop-color="#003a6b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e6fff" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- esquinas HUD -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glow)">
    <path d="M20 50V20H50"/><path d="M950 20H980V50"/>
    <path d="M20 230V260H50"/><path d="M950 260H980V230"/>
  </g>

  <!-- línea de escaneo -->
  <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;280" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- partículas -->
  <g fill="#00f0ff">
    <circle cx="120" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="90" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="220" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="230" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Courier New', Consolas, monospace" font-weight="bold" text-anchor="middle" font-size="96" letter-spacing="10">
    <!-- capa magenta glitch -->
    <text x="500" y="148" fill="#ff2bd6" opacity="0.75">JUAN RB
      <animate attributeName="x" values="500;500;494;506;500;500;503;497;500" keyTimes="0;0.55;0.57;0.59;0.61;0.8;0.82;0.84;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <!-- capa cian glitch -->
    <text x="500" y="148" fill="#00f0ff" opacity="0.75">JUAN RB
      <animate attributeName="x" values="500;500;506;494;500;500;497;503;500" keyTimes="0;0.55;0.57;0.59;0.61;0.8;0.82;0.84;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <!-- capa principal -->
    <text x="500" y="148" fill="#eaf6ff" filter="url(#glow)">JUAN RB</text>
  </g>

  <rect x="150" y="170" width="700" height="2" fill="url(#line)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="212" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="22" fill="#7fd4ff" letter-spacing="4">FULL STACK DEVELOPER // BACKEND ENGINEER</text>
  <text x="500" y="244" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#00f0ff" letter-spacing="3">&gt; STATUS: ONLINE
    <animate attributeName="opacity" values="1;1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>
